name: Verify Skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          python-version: ${{ matrix.python-version }}

      - name: Install locked maintainer dependencies
        run: uv sync --locked

      - name: Verify source contracts, installation, and upload packages
        run: |
          uv run --locked scripts/verify.py
          uv run --locked scripts/test_install.py
          uv run --locked scripts/test_packages.py
          uv run --locked scripts/test_tooling.py
          uv run --locked scripts/test_eval.py
          uv run --locked scripts/test_eval_cli.py
