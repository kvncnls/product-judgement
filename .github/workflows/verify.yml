name: Verify Skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install maintainer tooling dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Verify source contracts and generated bundles
        run: python scripts/verify.py
