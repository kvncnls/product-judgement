name: Release Skill packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # A release must clear the same Ruby 2.6 floor as a push, or a tag can ship
  # tooling that only runs on CI's interpreter.
  verify-macos-system-ruby:
    name: Verify on the Ruby macOS ships
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify source contracts and generated bundles on system Ruby
        run: |
          version=$(/usr/bin/ruby -e 'print RUBY_VERSION')
          echo "System Ruby is ${version}"
          unset GEM_HOME GEM_PATH RUBYOPT RUBYLIB BUNDLE_GEMFILE
          /usr/bin/ruby scripts/verify.rb
          /usr/bin/ruby scripts/test_install.rb
          /usr/bin/ruby scripts/test_packages.rb

  release:
    runs-on: ubuntu-latest
    needs: verify-macos-system-ruby
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Verify source contracts and generated bundles
        run: |
          ruby scripts/verify.rb
          ruby scripts/test_install.rb
          ruby scripts/test_packages.rb

      - name: Confirm the tag matches the plugin manifests
        run: ruby scripts/check_version.rb "${GITHUB_REF_NAME#v}"

      # package_skills.rb strips Claude Code-only frontmatter keys from the
      # packages, because a Claude.ai or Skills API upload rejects them outright.
      - name: Build upload packages
        run: |
          ruby scripts/package_skills.rb --out dist
          cp bundles/all.md dist/product-judgement-complete-bundle.md

      - name: Validate the downloadable archives
        run: ruby scripts/verify_packages.rb --dir dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Install for Claude Code, Cursor, or Codex with the plugin commands in
            [the README](https://github.com/kvncnls/product-judgement#install).

            The attachments below are for environments that take an upload instead.
            Their frontmatter carries only the six keys the Agent Skills spec
            allows, so they upload to Claude.ai and the Skills API as-is.

            - `<skill>.zip` — one Skill, ready to upload to Claude.ai or Claude Desktop.
            - `product-judgement-all-skills.zip` — all five Skill folders.
            - `product-judgement-complete-bundle.md` — all five Skills as one Markdown
              file, for a ChatGPT Project, a custom GPT, or a single rules file.
