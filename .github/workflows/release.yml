name: Release Skill packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          python-version: ${{ matrix.python-version }}

      - name: Install locked maintainer dependencies
        run: uv sync --locked

      - name: Verify source contracts, installation, and upload packages
        run: |
          uv run --locked scripts/verify.py
          uv run --locked scripts/test_install.py
          uv run --locked scripts/test_packages.py
          uv run --locked scripts/test_tooling.py
          uv run --locked scripts/test_eval.py
          uv run --locked scripts/test_eval_cli.py

  release:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          python-version: "3.14"

      - name: Install locked maintainer dependencies
        run: uv sync --locked

      - name: Confirm the tag matches the plugin manifests
        run: uv run --locked scripts/check_version.py "${GITHUB_REF_NAME#v}"

      # package_skills.py strips Claude Code-only frontmatter keys from the
      # packages, because a Claude.ai or Skills API upload rejects them outright.
      - name: Build upload packages
        run: |
          uv run --locked scripts/package_skills.py --out dist
          cp bundles/all.md dist/product-judgement-complete-bundle.md

      - name: Validate the downloadable archives
        run: uv run --locked scripts/verify_packages.py --dir dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Install for Claude Code, Cursor, or Codex with the plugin commands in
            [the README](https://github.com/kvncnls/product-judgement#install).

            The attachments below are for environments that take an upload instead.
            Their frontmatter carries only the six keys the Agent Skills spec
            allows, so they upload to Claude.ai and the Skills API as-is.

            - `<skill>.zip` — one Skill, ready to upload to Claude.ai or Claude Desktop.
            - `product-judgement-all-skills.zip` — all five Skill folders.
            - `product-judgement-complete-bundle.md` — all five Skills as one Markdown
              file, for a ChatGPT Project, a custom GPT, or a single rules file.
